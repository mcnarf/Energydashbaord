services:
  voltix-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    # Optional: Nach dem ersten GitHub Actions Build kann direkt das fertige Image genutzt werden:
    # image: ghcr.io/DEIN_GITHUB_USER/DEIN_REPO:latest
    container_name: voltix-dashboard
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
